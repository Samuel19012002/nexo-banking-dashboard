databases:
  - name: nexo-postgres
    plan: free
    postgresMajorVersion: "17"
    databaseName: nexo
    user: nexo

services:
  - type: web
    name: nexo-banking-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexo-postgres
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
